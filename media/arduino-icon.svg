<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arduino board outline -->
  <rect x="3" y="7" width="18" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  
  <!-- Minus sign (left circle) -->
  <circle cx="8" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="7" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Plus sign (right circle) -->
  <circle cx="16" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="15" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="11" x2="16" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Top pins -->
  <line x1="6" y1="7" x2="6" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="9" y1="7" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="7" x2="12" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="7" x2="15" y2="5" stroke="currentColor" stroke-width="1.2"/>
  <line x1="18" y1="7" x2="18" y2="5" stroke="currentColor" stroke-width="1.2"/>
  
  <!-- Bottom pins -->
  <line x1="6" y1="17" x2="6" y2="19" stroke="currentColor" stroke-width="1.2"/>
  <line x1="9" y1="17" x2="9" y2="19" stroke="currentColor" stroke-width="1.2"/>
  <line x1="12" y1="17" x2="12" y2="19" stroke="currentColor" stroke-width="1.2"/>
  <line x1="15" y1="17" x2="15" y2="19" stroke="currentColor" stroke-width="1.2"/>
  <line x1="18" y1="17" x2="18" y2="19" stroke="currentColor" stroke-width="1.2"/>
</svg>
